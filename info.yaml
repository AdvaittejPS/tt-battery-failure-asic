# Tiny Tapeout project information
project:
  title:        "Dual-Mode Battery Failure ASIC"
  author:       "Advaittej"
  discord:      "" 
  description:  "Event-driven, approximate computing MAC filter for detecting thermal runaway via radiography and thermal ejecta."
  language:     "Verilog" 
  clock_hz:     10000000 

  # How many tiles your design occupies?
  tiles: "1x1" 

  # Your top module name must start with "tt_um_". 
  top_module:  "tt_um_advaittej_bms"

  # List your project's source files here.
  # Assuming you saved the monolithic code into a file named tt_um_df_top.v
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Sensor Data Bit 0 (LSB)"
  ui[1]: "Sensor Data Bit 1"
  ui[2]: "Sensor Data Bit 2"
  ui[3]: "Sensor Data Bit 3"
  ui[4]: "Sensor Data Bit 4"
  ui[5]: "Sensor Data Bit 5"
  ui[6]: "Sensor Data Bit 6"
  ui[7]: "Sensor Data Bit 7 (MSB)"

  # Outputs
  uo[0]: "Trigger Alarm (Hardware Interrupt)"
  uo[1]: "Tied Low"
  uo[2]: "Tied Low"
  uo[3]: "Tied Low"
  uo[4]: "Tied Low"
  uo[5]: "Tied Low"
  uo[6]: "Tied Low"
  uo[7]: "Tied Low"

  # Bidirectional pins
  uio[0]: "Mode Select (0=Radiography, 1=Thermal)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
